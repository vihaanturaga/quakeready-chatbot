<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding: 10px; }
  .msg { margin: 8px 0; padding: 10px 14px; border-radius: 18px; max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
  .user { background: #E8543A; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
  .bot { background: white; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  .typing { color: #999; font-style: italic; }
  #input-area { display: flex; padding: 10px; background: white; border-top: 1px solid #ddd; gap: 8px; }
  #input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; outline: none; }
  #send { background: #E8543A; color: white; border: none; border-radius: 20px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="chat">
  <div class="msg bot">👋 Hi! I'm your earthquake safety assistant. Ask me anything about earthquake preparedness!</div>
</div>
<div id="input-area">
  <input id="input" type="text" placeholder="Ask a question..." />
  <button id="send">Send</button>
</div>
<script>
var WORKER_URL = 'https://fancy-lab-232f.vihaan-turaga.workers.dev';

function addMsg(text, type) {
  var div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  document.getElementById('chat').appendChild(div);
  div.scrollIntoView();
  return div;
}

document.getElementById('send').addEventListener('click', function() {
  var input = document.getElementById('input');
  var question = input.value.trim();
  if (!question) return;
  
  addMsg(question, 'user');
  input.value = '';
  
  var typing = addMsg('Thinking...', 'bot typing');
  
  fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: question })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    typing.textContent = data.answer;
    typing.className = 'msg bot';
  })
  .catch(function() {
    typing.textContent = 'Sorry, could not connect. Please try again.';
    typing.className = 'msg bot';
  });
});

document.getElementById('input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') document.getElementById('send').click();
});
</script>
</body>
</html>
